name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install deps
        run: bun install

      - name: Build
        run: bun run build

      - name: Read version from manifest
        id: version
        run: echo "version=$(jq -r .version dist/manifest.json)" >> $GITHUB_OUTPUT

      - name: Zip dist contents
        run: |
          cd dist
          zip -r ../mockify-${{ steps.version.outputs.version }}.zip .
          cd -

      - name: Restore CRX private key
        shell: bash
        run: |
          echo "${{ secrets.PRIVATE_KEY_BASE64 }}" | base64 -d > private.pem
          chmod 600 private.pem

      - name: Pack CRX with stable key
        run: bunx crx3 dist --key private.pem -o mockify.crx

      - name: Create GitHub Release (auto-creates tag if missing)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ steps.version.outputs.version }}
          body: Auto release
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            mockify-${{ steps.version.outputs.version }}.zip
            mockify.crx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
